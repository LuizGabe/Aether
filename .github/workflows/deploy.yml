name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag estavel, por exemplo v0.2.0 (deve coincidir com a versao do projeto)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate stable release version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Use uma tag estavel vX.Y.Z, sem sufixos de prerelease.' }
          $version = $Matches[1]
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'A tag e package.json nao coincidem.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build self-contained Windows installer
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: aether-windows-${{ steps.version.outputs.version }}
          path: dist/releases/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: aether-windows-${{ needs.windows.outputs.version }}
          path: release-assets
      - name: Verify checksums and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_SHA: ${{ needs.windows.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          files=("Aether-v${RELEASE_VERSION}-windows-x64-setup.exe" "SHA256SUMS.txt" "BUILD-MANIFEST.json" "LEIA-ME.md" "LICENSE.txt" "THIRD_PARTY_NOTICES.md")
          for file in "${files[@]}"; do test -f "$file"; done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "Aether ${RELEASE_TAG}" --notes-file "../docs/releases/${RELEASE_VERSION}.md" --draft
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
