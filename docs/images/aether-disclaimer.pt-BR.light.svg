<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="140" viewBox="0 0 1120 140" role="img" aria-labelledby="title desc" xml:lang="pt-BR"><title id="title">AVISO DE RESPONSABILIDADE</title><desc id="desc">Sem aconselhamento financeiro. Confira os dados, proteja suas credenciais e mantenha backups. Fornecido “como está”, com responsabilidade limitada conforme a lei. Leia o aviso completo abaixo.</desc><style>text{font-family:"Segoe UI",Arial,sans-serif}.flow{animation:drift 4s linear infinite}@keyframes drift{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="1" y="1" width="1118" height="138" rx="16" fill="#FFF5D6" stroke="#DFC47B"/><rect x="1" y="26" width="3" height="88" rx="1.5" fill="#F1CE68"/><rect x="24" y="42" width="56" height="56" rx="16" fill="#F1CE68" stroke="#F1CE68"/><g fill="none" stroke="#493615" stroke-width="2.2" stroke-linejoin="round"><path d="M49 54a3.5 3.5 0 0 1 6 0l15 26a3.5 3.5 0 0 1-3 5H37a3.5 3.5 0 0 1-3-5Z"/><path d="M52 64v9" stroke-linecap="round"/><circle cx="52" cy="79" r=".8"/></g><text x="104" y="38" font-size="12" fill="#654B20" font-weight="700" letter-spacing="2">AVISO DE RESPONSABILIDADE</text><text x="104" y="68" font-size="22" fill="#654B20" font-weight="700" letter-spacing="-.3">O Aether organiza suas finanças. As decisões são suas.</text><text x="104" y="94" font-size="16" fill="#654B20" font-weight="400" >Sem aconselhamento financeiro. Confira os dados, proteja suas credenciais e mantenha backups.</text><text x="104" y="117" font-size="15" fill="#654B20" font-weight="400" >Fornecido “como está”, com responsabilidade limitada conforme a lei. Leia o aviso completo abaixo.</text><text x="1084" y="38" font-size="11" fill="#654B20" font-weight="600" text-anchor="end" letter-spacing="1">PARA QUEM USA</text></svg>
