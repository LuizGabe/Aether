<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img"><title>Aether — ilustração com dados fictícios</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fbf1"/><stop offset="1" stop-color="#dfe9cf"/></linearGradient><linearGradient id="forest" x2="1" y2="1"><stop stop-color="#285a46"/><stop offset="1" stop-color="#143c31"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#163e2f" flood-opacity=".10"/></filter></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#234331}.muted{fill:#819078}.small{font-size:16px}.label{font-size:12px;letter-spacing:2px;fill:#879775}.title{font-size:24px;font-weight:700}.money{font-size:30px;font-weight:650;letter-spacing:-1px}</style><rect width="1400" height="420" rx="24" fill="url(#bg)"/><text x="70" y="68" class="label">CONTINUIDADE COM PRIVACIDADE</text><text x="68" y="116" font-size="34" font-weight="700">Seu histórico vai com você. Protegido por senha.</text><rect x="70" y="162" width="320" height="177" rx="20" fill="white"/><text x="104" y="214" class="title">Seu computador</text><text x="104" y="251" class="small muted">Dados locais, organizados</text><text x="104" y="278" class="small muted">do seu jeito.</text><path d="M424 246h115m-12-9 12 9-12 9M868 246h108m-12-9 12 9-12 9" stroke="#74945f" stroke-width="3" fill="none"/><rect x="573" y="162" width="261" height="177" rx="20" fill="url(#forest)"/><rect x="680" y="199" width="47" height="36" rx="7" fill="#dfe9c1"/><path d="M690 199v-9a14 14 0 0 1 28 0v9" stroke="#dfe9c1" stroke-width="5" fill="none"/><circle cx="704" cy="216" r="4" fill="#214f3e"/><text x="704" y="273" text-anchor="middle" style="fill:#e4eec7;font-size:21px;font-weight:700">.aetherbackup</text><text x="704" y="304" text-anchor="middle" style="fill:#b6cbaa;font-size:14px">AES-256-GCM</text><rect x="1010" y="162" width="320" height="177" rx="20" fill="white"/><text x="1044" y="214" class="title">Um novo começo</text><text x="1044" y="251" class="small muted">Restaure em outra instalação</text><text x="1044" y="278" class="small muted">usando a sua senha.</text><text x="70" y="384" class="small muted">Credenciais bancárias ficam fora do arquivo. A senha do backup não é recuperável pelo Aether.</text></svg>
