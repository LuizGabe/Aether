<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="238" viewBox="0 0 1120 238" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Your history goes with you. Protected by a password.</title><desc id="desc">Credentials stay out of the file. No password recovery or master key. Active SQLite storage is separate.</desc><style>text{font-family:"Segoe UI",Arial,sans-serif}.flow{animation:drift 4s linear infinite}@keyframes drift{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2A4032" stroke-width=".6"/></pattern></defs><rect x="1" y="1" width="1118" height="236" rx="20" fill="#14251E" stroke="#466049"/><rect x="1" y="1" width="1118" height="236" rx="20" fill="url(#grid)"/><text x="30" y="32" font-size="11" fill="#A9BEA1" font-weight="600" letter-spacing="2">CONTINUITY / WITH PRIVACY</text><text x="30" y="67" font-size="26" fill="#E1ECD7" font-weight="700" letter-spacing="-.5">Your history goes with you. Protected by a password.</text><rect x="30" y="91" width="268" height="94" rx="14" fill="#1D3328" stroke="#466049"/><g transform="translate(48 108) scale(1.0)" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 22h8m-4-5v5"/></g><text x="85" y="123" font-size="18" fill="#E1ECD7" font-weight="600" >Your computer</text><text x="48" y="160" font-size="15" fill="#A9BEA1" font-weight="400" >History and preferences</text><rect x="426" y="91" width="268" height="94" rx="14" fill="#1D3328" stroke="#466049"/><g transform="translate(444 108) scale(1.0)" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v3"/></g><text x="481" y="123" font-size="18" fill="#E1ECD7" font-weight="600" >.aetherbackup</text><text x="444" y="160" font-size="15" fill="#A9BEA1" font-weight="400" >Password-protected file</text><rect x="822" y="91" width="268" height="94" rx="14" fill="#1D3328" stroke="#466049"/><g transform="translate(840 108) scale(1.0)" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 22h8m-4-5v5"/></g><text x="877" y="123" font-size="18" fill="#E1ECD7" font-weight="600" >Another installation</text><text x="840" y="160" font-size="15" fill="#A9BEA1" font-weight="400" >Restore with your password</text><path d="M315 134Q361.5 128 408 134" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-dasharray="4 6" class="flow"/><path d="m402 129 6 5-6 4" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M711 134Q757.5 128 804 134" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-dasharray="4 6" class="flow"/><path d="m798 129 6 5-6 4" fill="none" stroke="#B6D28C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="119" font-size="11" fill="#A9BEA1" font-weight="600" text-anchor="middle">AES-256-GCM</text><text x="30" y="218" font-size="15" fill="#A9BEA1" font-weight="400" >Credentials stay out of the file. No password recovery or master key. Active SQLite storage is separate.</text></svg>
